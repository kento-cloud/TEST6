<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a0f"/>
      <stop offset="100%" stop-color="#0f2517"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#16a34a" stroke-width="1" fill="none">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="400" y1="0" x2="1200" y2="530"/>
    <line x1="800" y1="0" x2="1200" y2="260"/>
    <line x1="0" y1="200" x2="800" y2="630"/>
    <line x1="0" y1="400" x2="400" y2="630"/>
  </g>

  <!-- Neural network nodes (right side, decorative) -->
  <g transform="translate(880, 120)" opacity="0.10" fill="#16a34a" stroke="#16a34a">
    <path d="M40 60 L140 30 L240 90 M140 30 L120 160 M240 90 L120 160 M40 60 L120 160" stroke-width="2" fill="none" opacity="0.5"/>
    <circle cx="40" cy="60" r="14"/>
    <circle cx="140" cy="30" r="18"/>
    <circle cx="240" cy="90" r="14"/>
    <circle cx="120" cy="160" r="16"/>
  </g>

  <!-- Neural network nodes (left side, decorative) -->
  <g transform="translate(40, 380)" opacity="0.06" fill="#16a34a" stroke="#16a34a">
    <path d="M30 30 L120 10 L80 120 M120 10 L80 120 M30 30 L80 120" stroke-width="2" fill="none" opacity="0.5"/>
    <circle cx="30" cy="30" r="12"/>
    <circle cx="120" cy="10" r="15"/>
    <circle cx="80" cy="120" r="13"/>
  </g>

  <!-- Green accent line -->
  <rect x="480" y="220" width="240" height="3" rx="1.5" fill="url(#accent)" opacity="0.6"/>

  <!-- AI MEDIA logo text -->
  <text x="600" y="310" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="10">AI MEDIA</text>

  <!-- Green accent line below -->
  <rect x="480" y="340" width="240" height="3" rx="1.5" fill="url(#accent)" opacity="0.6"/>

  <!-- Tagline -->
  <text x="600" y="400" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="28" font-weight="400" fill="#a7f3d0" letter-spacing="4">AIを、もっと深く。</text>

  <!-- Bottom border accent -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)" opacity="0.4"/>
</svg>
