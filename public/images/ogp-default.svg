<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a0f"/>
      <stop offset="100%" stop-color="#0f2517"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#16a34a" stroke-width="1" fill="none">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="400" y1="0" x2="1200" y2="530"/>
    <line x1="800" y1="0" x2="1200" y2="260"/>
    <line x1="0" y1="200" x2="800" y2="630"/>
    <line x1="0" y1="400" x2="400" y2="630"/>
  </g>

  <!-- Horse silhouette (right side, decorative) -->
  <g transform="translate(820, 180) scale(2.2)" opacity="0.08" fill="#16a34a">
    <path d="M140 10c-5 0-10 3-13 7l-3 5c-2 0-4 1-6 3l-8 10c-3 4-5 8-5 13v8l-5 8c-2 3-3 7-3 11v15c0 3 1 6 3 8l-8 12c-2 3-3 7-3 10v10c0 4 2 7 5 9l5 3v8c0 5 4 9 9 9h4c5 0 9-4 9-9v-12l10-8 15 2v18c0 5 4 9 9 9h4c5 0 9-4 9-9v-25l8-15c3-5 4-11 4-17v-20c0-8-3-15-8-21l-5-6c0-4-1-8-4-11l-7-9c-4-5-10-8-16-8h-5z"/>
  </g>

  <!-- Second horse silhouette (left side) -->
  <g transform="translate(50, 350) scale(1.5) scaleX(-1)" opacity="0.05" fill="#16a34a">
    <path d="M140 10c-5 0-10 3-13 7l-3 5c-2 0-4 1-6 3l-8 10c-3 4-5 8-5 13v8l-5 8c-2 3-3 7-3 11v15c0 3 1 6 3 8l-8 12c-2 3-3 7-3 10v10c0 4 2 7 5 9l5 3v8c0 5 4 9 9 9h4c5 0 9-4 9-9v-12l10-8 15 2v18c0 5 4 9 9 9h4c5 0 9-4 9-9v-25l8-15c3-5 4-11 4-17v-20c0-8-3-15-8-21l-5-6c0-4-1-8-4-11l-7-9c-4-5-10-8-16-8h-5z"/>
  </g>

  <!-- Green accent line -->
  <rect x="480" y="220" width="240" height="3" rx="1.5" fill="url(#accent)" opacity="0.6"/>

  <!-- PADDOCK logo text -->
  <text x="600" y="310" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="12">PADDOCK</text>

  <!-- Green accent line below -->
  <rect x="480" y="340" width="240" height="3" rx="1.5" fill="url(#accent)" opacity="0.6"/>

  <!-- Tagline -->
  <text x="600" y="400" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="28" font-weight="400" fill="#86efac" letter-spacing="4">AI</text>
  <text x="600" y="400" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="28" font-weight="400" fill="#86efac" letter-spacing="4">
    <tspan>AI</tspan><tspan fill="#a7f3d0" letter-spacing="2">&#x3067;&#x7AF6;&#x99AC;&#x3092;&#x3001;&#x3082;&#x3063;&#x3068;&#x6DF1;&#x304F;&#x3002;</tspan>
  </text>

  <!-- Bottom border accent -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)" opacity="0.4"/>
</svg>
